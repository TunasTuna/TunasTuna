<svg width="620" height="430" viewBox="0 0 620 430" xmlns="http://www.w3.org/2000/svg" font-family="'Cascadia Code','Fira Code',Consolas,monospace">
  <defs>
    <style>
      .lbl { fill: #4fd6d0; font-size: 13.5px; }
      .val { fill: #d6e2e6; font-size: 13.5px; }
      .dots{ fill: #3a4a4d; font-size: 13.5px; }
      .head{ fill: #ffffff; font-size: 15px; font-weight: 700; }
      .sec { fill: #4fd6d0; font-size: 13.5px; font-weight: 700; }
      .rule{ stroke: #2a3538; stroke-width: 1; }
    </style>
  </defs>

  <rect width="620" height="430" rx="10" fill="#0d1117" stroke="#21282b" stroke-width="1"/>

  <!-- title bar -->
  <circle cx="24" cy="24" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="24" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="24" r="6" fill="#27c93f"/>
  <text x="310" y="29" text-anchor="middle" class="val" fill="#7d8b8e" font-size="12">tuna@github</text>

  <!-- header -->
  <text x="30" y="66" class="head">tuna@github</text>
  <line x1="30" y1="76" x2="590" y2="76" class="rule"/>

  <!-- System section -->
  <text x="30" y="102" class="sec">System</text>
  <text x="30" y="124" class="lbl">OS</text><text x="140" y="124" class="dots">..................</text><text x="330" y="124" class="val">Linux (Fedora / Ubuntu / Arch)</text>
  <text x="30" y="146" class="lbl">Editor</text><text x="140" y="146" class="dots">..................</text><text x="330" y="146" class="val">[YOUR EDITOR / IDE]</text>
  <text x="30" y="168" class="lbl">Shell</text><text x="140" y="168" class="dots">..................</text><text x="330" y="168" class="val">[YOUR SHELL, e.g. zsh]</text>

  <line x1="30" y1="184" x2="590" y2="184" class="rule"/>

  <!-- Languages section -->
  <text x="30" y="208" class="sec">Languages</text>
  <text x="30" y="230" class="lbl">Programming</text><text x="170" y="230" class="dots">..............</text><text x="330" y="230" class="val">C++, Python</text>
  <text x="30" y="252" class="lbl">Tools</text><text x="170" y="252" class="dots">..............</text><text x="330" y="252" class="val">PyTorch, scikit-learn, NumPy</text>
  <text x="30" y="274" class="lbl">Human</text><text x="170" y="274" class="dots">..............</text><text x="330" y="274" class="val">[YOUR LANGUAGES]</text>

  <line x1="30" y1="290" x2="590" y2="290" class="rule"/>

  <!-- Contact section -->
  <text x="30" y="314" class="sec">Contact</text>
  <text x="30" y="336" class="lbl">Email</text><text x="170" y="336" class="dots">..............</text><text x="330" y="336" class="val">juntillatantan@gmail.com</text>
  <text x="30" y="358" class="lbl">Reddit</text><text x="170" y="358" class="dots">..............</text><text x="330" y="358" class="val">Remarkable-Western-8</text>

  <line x1="30" y1="374" x2="590" y2="374" class="rule"/>

  <!-- GitHub stats -->
  <text x="30" y="398" class="sec">GitHub</text>
  <text x="30" y="420" class="lbl">Repos</text><text x="140" y="420" class="dots">....</text><text x="200" y="420" class="val">[REPOS]</text>
  <text x="300" y="420" class="lbl">Stars</text><text x="380" y="420" class="dots">....</text><text x="440" y="420" class="val">[STARS]</text>
</svg>
